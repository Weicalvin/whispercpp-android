name: Build Whisper Translator APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 設定官方 Gradle 環境（解決缺少 wrapper 問題）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 清除舊模型並下載 ggml-small-q5_1.bin (190MB)
        run: |
          rm -rf app/src/main/assets/models/*
          mkdir -p app/src/main/assets/models
          curl -L https://huggingface.co -o app/src/main/assets/models/ggml-small-q5_1.bin

      - name: 使用系統 Gradle 編譯 Debug APK
        run: gradle assembleDebug

      - name: 上傳打包好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-JaEn-ZhTW-APK
          path: app/build/outputs/apk/debug/app-debug.apk
